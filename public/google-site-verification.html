<!DOCTYPE html>
<!--
  GOOGLE SEARCH CONSOLE — SITE OWNERSHIP VERIFICATION

  HOW TO USE (HTML file method):
  1. In Google Search Console, add https://toss.ng as a property.
  2. Choose the "HTML file" verification method.
  3. Google gives you a file with a name like: google123abc456def.html
  4. Rename THIS file to exactly the name Google gives you (e.g. google123abc456def.html)
     and replace the content below with the actual content Google provides.
  5. Upload the renamed file to the root of the website (/public/ on this project,
     which becomes the web root after build).
  6. Click "Verify" in Google Search Console.

  ALTERNATIVE (Default / simplest):
  Use the DNS TXT record method instead — add the TXT record to your
  toss.ng / www.toss.ng DNS zone. No file upload needed.

  NOTE: Do NOT leave a fabricated placeholder as the live verification file.
  The value below is a SAFE PLACEHOLDER only and does NOT verify ownership.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Search Console Verification — Tech One-Stop Solution Ltd</title>
    <!-- REPLACE the content attribute below with your real Google verification value -->
    <meta
      name="google-site-verification"
      content="PASTE_YOUR_REAL_GOOGLE_VERIFICATION_CODE_HERE"
    />
  </head>
  <body>
    <p>
      Google Site Verification placeholder for Tech One-Stop Solution Ltd.
      Replace the meta content value before verifying ownership.
    </p>
  </body>
</html>
